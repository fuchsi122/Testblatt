<h3>Wähle deine Art von Erprobung: </h3>
<select [(ngModel)]="art">
  <option>1.Erprobungsspiel</option>
  <option>2.Erprobungsspiel</option>
  <option>1.Erprobung</option>
  <option>2.Erprobung</option>
  <option>3.Erprobung</option>
</select>

<button (click)="auswahl()">Auswählen</button>

<button (click)="zurueck()">Zurück</button>

@if (erorr) {
  <p [style.color]="'red'">Du musst eine Kategorie auswählen!</p>
}
