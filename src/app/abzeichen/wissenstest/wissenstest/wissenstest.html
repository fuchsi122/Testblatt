<h3>Wähle deine Art von Wissenstest: </h3>
<select [(ngModel)]="art">
  <option>Bronze-Spiel</option>
  <option>Silber-Spiel</option>
  <option>Bronze</option>
  <option>Silber</option>
  <option>Gold/Doppel Gold</option>
</select>

<button (click)="auswahl()">Auswählen</button>
<button (click)="zurueck()">Zurück</button>

@if (erorr) {
  <p [style.color]="'red'">Du musst eine Kategorie auswählen!</p>
}
