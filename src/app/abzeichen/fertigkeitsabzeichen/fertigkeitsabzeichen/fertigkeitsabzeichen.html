<h3>Wähle deine Art von Fertigkeitsabzeichen: </h3>
<select [(ngModel)]="art">
  <option>Melder</option>
  <option>Melderspiel</option>
  <option>Feuerwehrtechnik</option>
  <option>Feuerwehrtechnikspiel</option>
  <option>Sicher zu Wasser und am Land</option>
  <option>Sicher zu Wasser und am Land-Spiel</option>
</select>

<button (click)="auswahl()">Auswählen</button>
<button (click)="zurueck()">Zurück</button>

@if (erorr) {
  <p [style.color]="'red'">Du musst eine Kategorie auswählen!</p>
}
