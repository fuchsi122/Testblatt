<h3>Wähle die Art deines Abzeichens aus: </h3>

<select [(ngModel)]="art">
  <option>Erprobung</option>
  <option>Fertigkeitsabzeichen</option>
  <option>Wissenstest</option>
  <option>FJLA Gold</option>
</select>

<button (click)="auswahl()">Auswählen</button>
<br>
<p>Du kannst auch das <b>Gerätequiz</b> zur Erprobung machen: <a href="https://geraetequiz.netlify.app/">Hier</a></p>

@if (erorr) {
  <p [style.color]="'red'">Du musst eine Kategorie auswählen!</p>
}

<br>
@if (que) {
  <p><a (click)="quellen()">^ Quellen ausblenden: </a></p>
} @else {
  <p><a (click)="quellen()">> Quellen anzeigen: </a></p>
}

@if (que) {
  <a></a>
  <app-quellen></app-quellen>
}
